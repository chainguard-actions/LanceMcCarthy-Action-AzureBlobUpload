name: 'Pull Request Validation'
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

env:
  ALLOWED_ENDPOINTS: "github.com:443 registry.npmjs.org:443 api.akeyless.io:443"

jobs:
#--------------------------------------------------------------------------------------#
# Ensure the package builds and all tests pass.
#--------------------------------------------------------------------------------------#
  Package_RunTests:
    name: 'Build Package and Run Tests'
    if: contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          
      - name: "Run scripts"
        run: npm run all
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload built action artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: built-action-artifacts
          path: |
            dist/**
            lib/**


#--------------------------------------------------------------------------------------#
# Temp directory Tests
#--------------------------------------------------------------------------------------#
  Linux_TempDir_Test:
    name: 'Test Linux Temp Directory'
    runs-on: ubuntu-latest
    needs: Package_RunTests
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download built action artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-action-artifacts
          path: .

      - name: Generate temp files for upload test
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/my-data"
          for i in {1..10}; 
            do echo "Test file $i" > "$RUNNER_TEMP/my-data/file_$i.txt";
          done

      - uses: ./
        name: Upload Temp Directory Files
        with:
          connection_string: ${{secrets.AzureBlobConnectionString}}
          container_name: ci-cd
          destination_folder: TempDirTest/Linux
          source_folder: ${{runner.temp}}/my-data
          clean_destination_folder: true

  Windows_TempDir_Test:
    name: 'Test Windows Temp Directory'
    runs-on: windows-latest
    needs: Package_RunTests
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download built action artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: built-action-artifacts
          path: .

      - name: Generate temp files for upload test
        shell: pwsh
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/my-data"
          1..10 | ForEach-Object { "Test file $_" | Out-File "$env:RUNNER_TEMP/my-data/file_$_.txt" }

      - uses: ./
        name: Upload Temp Directory Files
        with:
          connection_string: ${{secrets.AzureBlobConnectionString}}
          container_name: ci-cd
          destination_folder: TempDirTest/Windows
          source_folder: ${{runner.temp}}/my-data
          clean_destination_folder: true
