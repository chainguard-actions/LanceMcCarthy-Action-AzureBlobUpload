name: Test service principal auth path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a test file
        run: |
          mkdir -p /tmp/test-sp-upload-src
          echo "service principal test" > /tmp/test-sp-upload-src/test.txt

      - name: Run action with invalid service principal credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          tenant_id: "00000000-0000-0000-0000-000000000001"
          client_id: "00000000-0000-0000-0000-000000000002"
          client_secret: "fake-client-secret-value"
          storage_account: "fakestorageaccount"
          container_name: "test-container"
          source_folder: "/tmp/test-sp-upload-src/"
          destination_folder: "test-dest"
          auth_type: "service_principal"

      - name: Assert action failed (invalid service principal credentials should cause failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail with invalid service principal credentials but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid service principal credentials"
