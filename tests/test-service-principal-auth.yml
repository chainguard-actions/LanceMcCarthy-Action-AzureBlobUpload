name: Test service principal authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with files
        run: |
          mkdir -p /tmp/sp-upload-source
          echo "service principal test" > /tmp/sp-upload-source/sp-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          tenant_id: "00000000-0000-0000-0000-000000000001"
          client_id: "00000000-0000-0000-0000-000000000002"
          client_secret: "fake-client-secret-value"
          storage_account: "fakestorageaccount"
          container_name: "test-container"
          source_folder: "/tmp/sp-upload-source/"
          destination_folder: "sp-test-output"
          auth_type: "service_principal"
          fail_if_source_empty: "false"

      - name: Assert action ran (succeeded or failed gracefully with fake SP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake service principal credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
