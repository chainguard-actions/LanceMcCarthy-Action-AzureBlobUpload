name: Test invalid auth_type fails early
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/upload-src
          echo "hello" > /tmp/upload-src/test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: invalid_auth_mode
          container_name: my-container
          source_folder: /tmp/upload-src/

      - name: Assert action failed due to invalid auth_type
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid auth_type, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid auth_type"
