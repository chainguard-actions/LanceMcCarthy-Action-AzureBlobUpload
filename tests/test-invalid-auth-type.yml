name: Test invalid auth_type fails with clear error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy source folder with a file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-src"
          echo "hello" > "$GITHUB_WORKSPACE/upload-src/test.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: "invalid_mode"
          connection_string: "fake-connection-string"
          container_name: "test-container"
          source_folder: "${{ github.workspace }}/upload-src/"

      - name: Assert action failed due to invalid auth_type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid auth_type, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid auth_type"
