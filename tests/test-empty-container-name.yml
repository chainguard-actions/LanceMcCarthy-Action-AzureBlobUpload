name: Test empty container_name fails validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy source folder with a file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-src"
          echo "hello" > "$GITHUB_WORKSPACE/upload-src/test.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: "connection_string"
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fake;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          container_name: ""
          source_folder: "${{ github.workspace }}/upload-src/"

      - name: Assert action failed due to empty container_name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty container_name, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with empty container_name"
