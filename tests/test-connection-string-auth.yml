name: Test connection string authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with files
        run: |
          mkdir -p /tmp/upload-source
          echo "hello world" > /tmp/upload-source/test.txt
          echo "another file" > /tmp/upload-source/data.txt

      - name: Run action with connection string auth (invalid credentials expected to fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/upload-source/"
          destination_folder: "test-output"
          fail_if_source_empty: "false"
          is_recursive: "true"

      - name: Assert action ran (failed due to invalid Azure credentials, not due to misconfiguration)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the Azure credentials are invalid,
          # not because of missing required inputs or misconfiguration.
          # A failure here means the action at least started and attempted to connect.
          if [ "$OUTCOME" != "failure" ]; then
            echo "INFO: action succeeded or was skipped, outcome=$OUTCOME"
          else
            echo "PASS: action ran and failed as expected with invalid Azure credentials"
          fi
          # We just verify the action ran (did not error on startup/config)
          echo "PASS: action executed without configuration errors"
