name: Test connection string authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with files
        run: |
          mkdir -p /tmp/upload-source
          echo "hello world" > /tmp/upload-source/test-file.txt
          echo "another file" > /tmp/upload-source/another.txt

      - name: Run action with connection string auth (fake credentials - expected to fail at Azure)
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXk=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/upload-source/"
          destination_folder: "test-uploads"
          fail_if_source_empty: "false"
          is_recursive: "true"
          delete_if_exists: "false"

      - name: Assert action ran (outcome is failure due to fake Azure credentials, not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Azure credentials are fake,
          # but it should NOT be skipped — it must have been invoked.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME, expected failure due to fake Azure credentials)"
