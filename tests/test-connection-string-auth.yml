name: Test connection string auth path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a test file
        run: |
          mkdir -p /tmp/test-upload-src
          echo "hello world" > /tmp/test-upload-src/test.txt

      - name: Run action with invalid connection string (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakestorageaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/test-upload-src/"
          destination_folder: "test-dest"
          auth_type: "connection_string"

      - name: Assert action failed (invalid credentials should cause failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
