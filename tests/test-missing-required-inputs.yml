name: Test missing required inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a test file
        run: |
          mkdir -p /tmp/test-missing-src
          echo "test content" > /tmp/test-missing-src/test.txt

      - name: Run action without any auth credentials (expect failure)
        id: action_no_auth
        uses: .
        continue-on-error: true
        with:
          container_name: "test-container"
          source_folder: "/tmp/test-missing-src/"
          destination_folder: "test-dest"

      - name: Assert action failed when no auth credentials provided
        run: |
          echo "outcome: ${{ steps.action_no_auth.outcome }}"
          if [ "${{ steps.action_no_auth.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail when no auth credentials are provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no auth credentials provided"
