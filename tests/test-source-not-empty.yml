name: Test source folder with files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with files
        run: |
          mkdir -p /tmp/upload-source
          echo "hello world" > /tmp/upload-source/test.txt
          echo "another file" > /tmp/upload-source/data.txt

      - name: Run action with files in source folder
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2U=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/upload-source/"
          fail_if_source_empty: "false"
          auth_type: "connection_string"

      - name: Assert action ran (not skipped) - it may fail on Azure connection but should not fail on empty source check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to invalid Azure credentials, not empty source)"
