name: Test missing connection_string validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/test-upload-src
          echo "hello" > /tmp/test-upload-src/hello.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: "connection_string"
          # connection_string intentionally omitted (empty)
          container_name: "test-container"
          source_folder: "/tmp/test-upload-src/"

      - name: Assert action failed due to missing connection_string
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connection_string is empty, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with empty connection_string"
