name: Test destination_folder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/upload-src
          echo "hello" > /tmp/upload-src/test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: 'DefaultEndpointsProtocol=https;AccountName=fake;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net'
          container_name: 'test-container'
          source_folder: '/tmp/upload-src/'
          destination_folder: 'my/target/folder'
          fail_if_source_empty: 'false'
          is_recursive: 'true'

      - name: Assert action ran (with destination_folder input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the connection string is fake,
          # but it must have been invoked (not skipped). Either 'failure' or
          # 'success' means the action ran with destination_folder provided.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it should have run"
            exit 1
          fi
          echo "PASS: action ran with destination_folder input provided (outcome=$OUTCOME)"
