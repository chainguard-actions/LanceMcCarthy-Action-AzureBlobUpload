name: Test missing credentials fails (service principal inferred)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tenant_id: some-tenant
          client_id: some-client
          storage_account: someaccount
          container_name: my-container
          source_folder: tests/fixtures/upload/
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure for missing client_secret"; exit 1; fi
          echo "PASS"
