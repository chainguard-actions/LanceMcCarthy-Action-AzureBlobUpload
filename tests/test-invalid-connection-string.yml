name: Test invalid connection string auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/upload-source
          echo "hello world" > /tmp/upload-source/test.txt

      - name: Run action with invalid connection string
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXk=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/upload-source/"
          fail_if_source_empty: "false"
          auth_type: "connection_string"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Azure credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid Azure credentials"
