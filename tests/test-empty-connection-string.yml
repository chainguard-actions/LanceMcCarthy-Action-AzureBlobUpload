name: Test empty connection_string fails validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy source folder with a file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upload-src"
          echo "hello" > "$GITHUB_WORKSPACE/upload-src/test.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: "connection_string"
          connection_string: ""
          container_name: "test-container"
          source_folder: "${{ github.workspace }}/upload-src/"

      - name: Assert action failed due to empty connection_string
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty connection_string, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with empty connection_string"
