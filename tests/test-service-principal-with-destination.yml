name: Test service principal auth with destination folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/upload-src
          echo "hello" > /tmp/upload-src/test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          tenant_id: "00000000-0000-0000-0000-000000000001"
          client_id: "00000000-0000-0000-0000-000000000002"
          client_secret: "fake-client-secret-value"
          storage_account: "fakestorageaccount"
          container_name: "test-container"
          source_folder: "/tmp/upload-src/"
          destination_folder: "uploads/test-run"
          auth_type: "service_principal"

      - name: Assert action failed due to invalid service principal credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid service principal credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid service principal credentials"
