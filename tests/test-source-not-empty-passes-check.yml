name: Test source not empty passes empty check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with files
        run: |
          mkdir -p /tmp/nonempty-source
          echo "file content" > /tmp/nonempty-source/file1.txt
          echo "more content" > /tmp/nonempty-source/file2.txt

      - name: Run action with non-empty source and fail_if_source_empty=true
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXk=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/nonempty-source/"
          fail_if_source_empty: "true"

      - name: Assert action was invoked (not skipped due to empty source check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a non-empty source folder, the action should NOT be skipped.
          # It will fail at Azure connection (fake credentials), but that's expected.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked past the empty-source check (outcome=$OUTCOME)"
