name: Test fail_if_source_empty with empty source folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AZ_CS: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start Azurite blob emulator
        run: bash tests/fixtures/start-azurite.sh
      - name: Create empty source folder
        run: rm -rf empty-src && mkdir -p empty-src
      - id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: ${{ env.AZ_CS }}
          container_name: empty-test
          source_folder: empty-src/
          fail_if_source_empty: "true"
      - name: Assert action failed and nothing was uploaded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure for empty source"; exit 1; fi
          LIST="$(NODE_PATH=/tmp/azt/node_modules node tests/fixtures/list-blobs.cjs empty-test)"
          echo "blobs: $LIST"
          if [ -n "$LIST" ]; then echo "FAIL: expected no blobs"; exit 1; fi
          echo "PASS"
