name: Test fail_if_source_empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty source folder
        run: mkdir -p /tmp/empty-source

      - name: Run action with empty source and fail_if_source_empty=true
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXk=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/empty-source/"
          fail_if_source_empty: "true"

      - name: Assert action failed due to empty source
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when source folder is empty and fail_if_source_empty=true"
            exit 1
          fi
          echo "PASS: action correctly failed when source folder was empty"
