name: Test fail_if_source_empty behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty source folder
        run: |
          mkdir -p /tmp/empty-upload-src

      - name: Run action with empty source and fail_if_source_empty=true (expect failure)
        id: action_fail
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakestorageaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/empty-upload-src/"
          destination_folder: "test-dest"
          fail_if_source_empty: "true"
          auth_type: "connection_string"

      - name: Assert action failed when source is empty and fail_if_source_empty is true
        run: |
          echo "outcome: ${{ steps.action_fail.outcome }}"
          if [ "${{ steps.action_fail.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail when source folder is empty and fail_if_source_empty=true"
            exit 1
          fi
          echo "PASS: action correctly failed when source folder is empty"
