name: Test missing container_name validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/test-upload-src
          echo "hello" > /tmp/test-upload-src/hello.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: "connection_string"
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          # container_name intentionally omitted (empty string)
          container_name: ""
          source_folder: "/tmp/test-upload-src/"

      - name: Assert action failed due to missing container_name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when container_name is empty, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with empty container_name"
