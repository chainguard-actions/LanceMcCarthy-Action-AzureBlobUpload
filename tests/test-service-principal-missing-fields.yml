name: Test service_principal auth with missing fields fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with a file
        run: |
          mkdir -p /tmp/upload-src
          echo "hello" > /tmp/upload-src/test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          auth_type: "service_principal"
          tenant_id: ""
          client_id: ""
          client_secret: ""
          storage_account: ""
          container_name: "test-container"
          source_folder: "/tmp/upload-src/"

      - name: Assert action failed due to missing service principal fields
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing service principal fields, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing service principal fields"
