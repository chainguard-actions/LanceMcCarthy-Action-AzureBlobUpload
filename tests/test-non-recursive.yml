name: Test non-recursive upload option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source folder with files and subfolders
        run: |
          mkdir -p /tmp/nonrecursive-source/subdir
          echo "root file" > /tmp/nonrecursive-source/root.txt
          echo "sub file" > /tmp/nonrecursive-source/subdir/sub.txt

      - name: Run action with is_recursive false
        id: action
        uses: .
        continue-on-error: true
        with:
          connection_string: "DefaultEndpointsProtocol=https;AccountName=fakeaccount;AccountKey=ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWs=;EndpointSuffix=core.windows.net"
          container_name: "test-container"
          source_folder: "/tmp/nonrecursive-source/"
          destination_folder: "nonrecursive-dest"
          is_recursive: "false"
          fail_if_source_empty: "true"

      - name: Assert action ran with is_recursive=false
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at Azure connection (fake credentials).
          # We just verify it ran and didn't fail at input validation.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with is_recursive=false (outcome=${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
